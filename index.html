<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 OSINT LAB | SAF GÜÇ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #10b981; font-family: 'Courier New', Courier, monospace; margin: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); border: 1px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); border-radius: 8px; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #10b981; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <!-- Üst Başlık -->
    <header class="w-full max-w-4xl mb-8 border-b border-emerald-500/30 pb-4 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h1 class="text-2xl md:text-3xl font-bold tracking-widest text-emerald-400">
                [ V8_PURE ] OSINT CORE
            </h1>
            <p class="text-xs text-emerald-600 mt-1">> GEREKSİZ MODÜLLER KAPATILDI - SAF VERİ ODAKLI</p>
        </div>
        <div class="flex items-center gap-3 border border-emerald-500/50 bg-emerald-900/20 px-4 py-2 rounded">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-emerald-400 font-bold tracking-wider">SİSTEM STABİL</span>
        </div>
    </header>

    <!-- Ana Arama Paneli -->
    <div class="w-full max-w-4xl glass-panel p-6 md:p-8 flex flex-col">
        <h2 class="text-xl font-bold mb-6 border-b border-emerald-500/30 pb-2 text-white">
            > KÜRESEL VERİ SIZINTISI (BREACH) TARAMASI
        </h2>
        
        <div class="mb-4">
            <label class="block text-sm text-emerald-600 mb-2">> Hedef E-Posta Adresi:</label>
            <input type="text" id="target-input" placeholder="Örn: ornek@gmail.com" 
                class="w-full bg-slate-950 border border-emerald-500/50 text-emerald-400 p-4 rounded focus:outline-none focus:border-emerald-400 font-mono text-lg">
        </div>
        
        <button id="search-btn" class="w-full bg-emerald-900 border border-emerald-500 hover:bg-emerald-500 hover:text-black text-emerald-500 font-bold py-4 px-4 rounded transition-colors duration-200 uppercase tracking-widest">
            [ SIZINTILARI SORGULA ]
        </button>
        
        <!-- Sonuç Ekranı -->
        <div id="results-box" class="mt-6 p-4 bg-slate-950 border border-emerald-800 rounded hidden font-mono text-sm min-h-[150px]">
            <!-- Sonuçlar buraya gelecek -->
        </div>
    </div>

    <!-- HİÇBİR ARKA PLAN İŞLEMİ OLMAYAN, SADECE BUTONA BASINCA ÇALIŞAN SAF KOD -->
    <script>
        const btn = document.getElementById('search-btn');
        const input = document.getElementById('target-input');
        const results = document.getElementById('results-box');

        // Tarama Fonksiyonu
        async function runScan() {
            const email = input.value.trim();
            
            if(!email || !email.includes('@')) {
                alert("[!] Lütfen geçerli bir e-posta adresi girin.");
                return;
            }
            
            // Yükleniyor ekranı
            results.classList.remove('hidden');
            results.innerHTML = `
                <div class="text-emerald-500 mb-2">> Sorgulanıyor: <span class="text-white">${email}</span></div>
                <div class="text-yellow-500 animate-pulse">[+] Veri tabanlarına bağlanılıyor, lütfen bekleyin...</div>
            `;
            
            try {
                // XposedOrNot Sızıntı API'si
                const response = await fetch(`https://api.xposedornot.com/v1/check-email/${email}`);
                
                if (response.status === 404) {
                    results.innerHTML = `
                        <div class="text-emerald-500 mb-2">> Sorgulandı: <span class="text-white">${email}</span></div>
                        <div class="text-[#00ff88] font-bold p-3 bg-emerald-900/20 border border-[#00ff88]/30">
                            [+] TEMİZ: Bu e-posta adresi bilinen hiçbir veri sızıntısında bulunamadı.
                        </div>
                    `;
                } else if (response.ok) {
                    const data = await response.json();
                    const breaches = (data.breaches && data.breaches[0]) ? data.breaches[0] : [];
                    
                    if (breaches.length > 0) {
                        // Sızıntıları liste formatına çevir
                        const breachList = breaches.map(b => `<div class="mb-1">> ${b}</div>`).join('');
                        
                        results.innerHTML = `
                            <div class="text-emerald-500 mb-2">> Sorgulandı: <span class="text-white">${email}</span></div>
                            <div class="text-red-500 font-bold mb-3">[!] DİKKAT: ${breaches.length} ADET SIZINTI TESPİT EDİLDİ!</div>
                            <div class="p-4 bg-red-950/30 border border-red-500/50 text-red-400">
                                <span class="text-slate-40
