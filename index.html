<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V9 OSINT LAB | KESİN ÇÖZÜM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #10b981; font-family: monospace; margin: 0; }
        .glass-panel { background: rgba(15, 23, 42, 0.9); border: 1px solid #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); border-radius: 8px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col items-center">

    <header class="w-full max-w-4xl mb-8 border-b border-emerald-500/30 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold tracking-widest text-emerald-400">[ V9_ULTRA_SAFE ]</h1>
        </div>
    </header>

    <div class="w-full max-w-4xl glass-panel p-6 flex flex-col">
        <h2 class="text-xl font-bold mb-6 border-b border-emerald-500/30 pb-2 text-white">
            > VERİ SIZINTISI TARAMASI
        </h2>
        
        <div class="mb-4">
            <input type="text" id="target-email" placeholder="Örn: test@gmail.com" 
                class="w-full bg-slate-950 border border-emerald-500/50 text-emerald-400 p-4 rounded focus:outline-none focus:border-emerald-400 text-lg">
        </div>
        
        <!-- Doğrudan onclick eklendi -->
        <button onclick="baslat()" class="w-full bg-emerald-900 border border-emerald-500 text-emerald-400 font-bold py-4 px-4 rounded active:bg-emerald-700">
            [ SIZINTILARI SORGULA ]
        </button>
        
        <div id="sonuc-kutusu" class="mt-6 p-4 bg-slate-950 border border-emerald-800 rounded font-mono text-sm hidden">
        </div>
    </div>

    <script>
        async function baslat() {
            // Butona basıldığını kanıtlamak için uyarı penceresi!
            alert("Sistem tetiklendi! E-posta taranıyor...");

            var email = document.getElementById('target-email').value;
            var sonuc = document.getElementById('sonuc-kutusu');

            if(email === "") {
                alert("Lütfen bir e-posta adresi yazın!");
                return;
            }

            sonuc.style.display = "block";
            sonuc.innerHTML = "<div style='color:yellow;'>Sorgulanıyor: " + email + " (Lütfen bekleyin...)</div>";

            try {
                var response = await fetch("https://api.xposedornot.com/v1/check-email/" + email);
                
                if (response.status === 404) {
                    sonuc.innerHTML = "<div style='color:#00ff88; font-weight:bold;'>[+] TEMİZ: Bu e-posta adresine ait sızıntı bulunamadı.</div>";
                } else if (response.status === 200) {
                    var data = await response.json();
                    var breaches = data.breaches[0];
                    
                    var liste = "";
                    for(var i=0; i<breaches.length; i++) {
                        liste += "<div>> " + breaches[i] + "</div>";
                    }

                    sonuc.innerHTML = 
                        "<div style='color:red; font-weight:bold; margin-bottom:10px;'>[!] DİKKAT: " + breaches.length + " SIZINTI TESPİT EDİLDİ!</div>" +
                        "<div style='border:1px solid red; padding:10px;'>" + liste + "</div>";
                } else {
                    sonuc.innerHTML = "<div style='color:orange;'>Sunucu hatası veya limit aşıldı.</div>";
                }
            } catch (err) {
                sonuc.innerHTML = "<div style='color:red; font-weight:bold;'>BAĞLANTI HATASI: Tarayıcınız isteği engelliyor olabilir.</div>";
            }
        }
    </script>
</body>
</html>
