<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4 QUANTUM | OSINT LAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #10b981; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; margin: 0; }
        #neural-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.4; pointer-events: none; }
        .glass-panel { background: rgba(2, 6, 23, 0.7); border: 1px solid #10b981; box-shadow: 0 0 30px rgba(16, 185, 129, 0.1); backdrop-filter: blur(12px); position: relative; z-index: 10; }
        .data-row { opacity: 0; transform: translateX(-20px); animation: slideIn 0.4s forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #10b981; }
        .cyber-glitch { position: relative; }
        .cyber-glitch::before, .cyber-glitch::after { content: attr(data-text); position: absolute; top: 0; left: 0; opacity: 0.8; }
        .cyber-glitch::before { left: 2px; text-shadow: -1px 0 red; animation: glitch-anim-1 2s infinite linear alternate-reverse; }
        .cyber-glitch::after { left: -2px; text-shadow: -1px 0 blue; animation: glitch-anim-2 3s infinite linear alternate-reverse; }
        @keyframes glitch-anim-1 { 0% { clip-path: inset(20% 0 80% 0); } 100% { clip-path: inset(80% 0 20% 0); } }
        @keyframes glitch-anim-2 { 0% { clip-path: inset(10% 0 60% 0); } 100% { clip-path: inset(30% 0 10% 0); } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen text-sm md:text-base">

    <canvas id="neural-canvas"></canvas>

    <header class="mb-8 border-b border-emerald-500/30 pb-4 flex flex-col md:flex-row justify-between items-center gap-4 relative z-10">
        <div>
            <h1 class="text-3xl font-bold tracking-widest text-emerald-400 cyber-glitch" data-text="[ V4.0_LIVE ] CORE">
                [ V4.0_LIVE ] CORE
            </h1>
            <p class="text-xs text-emerald-700 mt-1">> NEURAL NETWORK & REAL-TIME API CONNECTED</p>
        </div>
        <div class="flex items-center gap-3 border border-emerald-500/50 bg-emerald-900/20 px-4 py-2 rounded shadow-[0_0_15px_rgba(16,185,129,0.3)]">
            <div id="status-dot" class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
            <span id="status-text" class="text-emerald-400 font-bold tracking-wider">SYSTEM ONLINE</span>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">
        
        <div class="glass-panel p-6 rounded-lg relative overflow-hidden min-h-[550px]">
            <h2 class="text-xl font-bold mb-4 border-b border-emerald-500/30 pb-2 text-white flex justify-between">
                <span>> DEVICE_TELEMETRY</span>
                <span id="scan-percent" class="text-emerald-500">0%</span>
            </h2>
            <div id="fingerprint-data" class="space-y-3 font-mono mt-4 text-emerald-300">
                <div class="text-emerald-600 animate-pulse">> Quantum analizi başlatılıyor... Lütfen bekleyin.</div>
            </div>
            <canvas id="hidden-canvas" style="display:none;"></canvas>
        </div>

        <div class="glass-panel p-6 rounded-lg min-h-[550px] flex flex-col">

                > LIVE_OSINT_QUERY
            </h2>
            
            <div class="mb-6 relative">
                <input type="text" id="osint-input" placeholder="> E-posta adresi girin (örn: test@gmail.com)" 
                    class="w-full bg-slate-950 border border-emerald-500/50 text-emerald-400 p-4 rounded focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-all placeholder-emerald-800/50 font-mono shadow-[inset_0_0_20px_rgba(16,185,129,0.05)] relative z-10">
            </div>
            
            <button onclick="executeLiveScan()" class="w-full bg-emerald-950 border border-emerald-500 hover:bg-emerald-500 hover:text-black text-emerald-500 font-bold py-4 px-4 rounded transition-all duration-300 shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:shadow-[0_0_30px_rgba(16,185,129,0.6)] uppercase tracking-widest relative overflow-hidden group">
                <span class="relative z-10">[ SORGULAMAYI BAŞLAT ]</span>
                <div class="absolute inset-0 bg-emerald-400 transform scale-x-0 group-hover:scale-x-100 transition-transform origin-left duration-300 opacity-20"></div>
            </button>
            
            <div id="osint-results" class="mt-6 p-4 bg-slate-950/80 border border-emerald-800/50 rounded flex-grow font-mono text-sm overflow-y-auto hidden">
            </div>
        </div>
    </div>

            if (e.key === 'Enter') {
                executeLiveScan();
            }
        });

        const canvas = document.getElementById('neural-canvas');

        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
