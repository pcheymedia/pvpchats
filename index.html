<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V5 BYPASS | OSINT LAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: #10b981; font-family: 'Courier New', Courier, monospace; overflow-x: hidden; margin: 0; }
        #neural-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; pointer-events: none; }
        .glass-panel { background: rgba(2, 6, 23, 0.8); border: 1px solid #10b981; box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); backdrop-filter: blur(8px); position: relative; z-index: 10; }
        .data-row { opacity: 0; transform: translateX(-20px); animation: slideIn 0.4s forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #10b981; }
        .glitch-text { animation: glitch 2s infinite; }
        @keyframes glitch { 0% { text-shadow: 1px 0 0 red, -1px 0 0 blue; } 5% { text-shadow: -1px 0 0 red, 1px 0 0 blue; } 10% { text-shadow: 0 0 0 transparent; } 100% { text-shadow: 0 0 0 transparent; } }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen text-sm md:text-base">

    <canvas id="neural-canvas"></canvas>

    <header class="mb-6 border-b border-emerald-500/30 pb-4 flex flex-col md:flex-row justify-between items-center gap-4 relative z-10">
        <div>
            <h1 class="text-3xl font-bold tracking-widest text-emerald-400 glitch-text">
                [ V5.0_BYPASS ] CORE
            </h1>
            <p class="text-xs text-emerald-700 mt-1">> IOS SECURITY BYPASSED & API CONNECTED</p>
        </div>
        <div class="flex items-center gap-3 border border-emerald-500/50 bg-emerald-900/20 px-4 py-2 rounded shadow-[0_0_15px_rgba(16,185,129,0.3)]">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
            <span class="text-emerald-400 font-bold tracking-wider">SYSTEM ONLINE</span>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">
        
        <!-- TELEMETRİ BÖLÜMÜ -->
        <div class="glass-panel p-6 rounded-lg relative overflow-hidden min-h-[500px]">
            <h2 class="text-xl font-bold mb-4 border-b border-emerald-500/30 pb-2 text-white flex justify-between">
                <span>> DEVICE_TELEMETRY</span>
                <span id="scan-percent" class="text-emerald-500">0%</span>
            </h2>
            <div id="fingerprint-data" class="space-y-3 font-mono mt-4 text-emerald-300">
                <div id="loading-text" class="text-emerald-600 animate-pulse">> iOS Güvenlik Duvarı Aşılıyor...</div>
            </div>
        </div>

        <!-- OSINT BÖLÜMÜ -->
        <div class="glass-panel p-6 rounded-lg min-h-[500px] flex flex-col">
            <h2 class="text-xl font-bold mb-6 border-b border-emerald-500/30 pb-2 text-white">
                > LIVE_OSINT_QUERY
            </h2>
            
            <div class="mb-6 relative">
                <input type="text" id="osint-input" placeholder="> E-posta adresi girin (örn: test@gmail.com)" 
                    class="w-full bg-slate-950 border border-emerald-500/50 text-emerald-400 p-4 rounded focus:outline-none focus:border-emerald-400 focus:ring-1 focus:ring-emerald-400 transition-all font-mono shadow-[inset_0_0_20px_rgba(16,185,129,0.05)] relative z-10">
            </div>
            
            <button id="scan-btn" class="w-full bg-emerald-950 border border-emerald-500 hover:bg-emerald-500 hover:text-black text-emerald-500 font-bold py-4 px-4 rounded transition-all duration-300 shadow-[0_0_15px_rgba(16,185,129,0.2)] hover:shadow-[0_0_30px_rgba(16,185,129,0.6)] uppercase tracking-widest">
                [ SORGULAMAYI BAŞLAT ]
            </button>
            
            <div id="osint-results" class="mt-6 p-4 bg-slate-950/80 border border-emerald-800/50 rounded flex-grow font-mono text-sm overflow-y-auto hidden">
            </div>
        </div>
    </div>

    <!-- SCRIPT 1: NÖRAL AĞ VE GÖRSELLER (Asla çökmez) -->
    <script>
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth; let height = canvas.height = window.innerHeight;
        let particles = []; 
        window.addEventListener('resize', () => { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; });
        
        class Particle {
            constructor() { this.x = Math.random() * width; this.y = Math.random() * height; this.size = Math.random() * 2 + 1; this.speedX = Math.random() * 2 - 1; this.speedY = Math.random() * 2 - 1; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x > width || this.x < 0) this.speedX = -this.speedX; if (this.y > height || this.y < 0) this.speedY = -this.speedY; }
            draw() { ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fillStyle = '#10b981'; ctx.fill(); }
        }
        function initParticles() { particles = []; for (let i = 0; i < 50; i++) particles.push(new Particle()); }
        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update(); particles[i].draw();
                for (let j = i; j < particles.length; j++) {
                    let dx = particles[i].x - particles[j].x; let dy = particles[i].y - particles[j].y; let distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < 100) { ctx.beginPath(); ctx.strokeStyle = `rgba(16, 185, 129, ${1 - distance/100})`; ctx.lineWidth = 1; ctx.moveTo(particles[i].x, particles[i].y); ctx.lineTo(particles[j].x, particles[j].y); ctx.stroke(); }
                }
            } requestAnimationFrame(animateParticles);
        }
        initParticles(); animateParticles();
    </script>

    <!-- SCRIPT 2: TELEMETRİ (Hata yakalama kalkanı ile korundu) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const delay = ms => new Promise(res => setTimeout(res, ms));
            const fpDiv = document.getElementById('fingerprint-data');
            
            function appendData(label, value, colorClass = "text-emerald-400") { 
                const p = document.createElement('div'); 
                p.className = `data-row py-2 border-b border-emerald-500/10 flex justify-between items-center`; 
                p.innerHTML = `<span class="text-emerald-700/80">[+] ${label}</span> <span class="${colorClass} font-bold text-right">${value}</span>`; 
                fpDiv.appendChild(p); 
            }

            async function runSafeTelemetry() {
                try {
                    document.getElementById('loading-text').style.display = 'none';
                    const pct = document.getElementById('scan-percent');
                    
                    pct.innerText = "25%"; await delay(600);
                    appendData("Browser", navigator.userAgent.includes("Safari") && !navigator.userAgent.includes("Chrome") ? "Apple Safari (iOS)" : navigator.userAgent.split(' ')[0], "text-slate-300");
                    
                    pct.innerText = "50%"; await delay(600);
                    appendData("Platform", navigator.platform || "Mobil Cihaz", "text-white");
                    
                    pct.innerText = "75%"; await delay(600);
                    try {
                        const req = await fetch('https://ipapi.co/json/');
                        const net = await req.json();
                        appendData("Public IP", net.ip, "text-red-500");
                        appendData("Location", `${net.city}, ${net.country_name}`, "text-emerald-500");
                        appendData("ISP", net.org, "text-yellow-400");
                    } catch(e) {
                        appendData("Network", "Bağlantı Şifreli / Gizli", "text-red-500");
                    }
                    pct.innerText = "100%";
                } catch (error) {
                    fpDiv.innerHTML = `<div class="text-red-500">> Telemetri bypass edilemedi.</div>`;
                }
            }
            setTimeout(runSafeTelemetry, 500);
        });
    </script>

    <!-- SCRIPT 3: OSINT API (Sorgulama Butonu ve Enter Tuşu) -->
    <script>
        async function executeLiveScan() {
            const input = document.getElementById('osint-input').value.trim();
            const res = document.getElementById('osint-results');
            
            if(!input || !input.includes('@')) {
                alert("[!] Lütfen geçerli bir e-posta adresi girin.");
                return;
            }
            
            res.classList.remove('hidden');
            res.innerHTML = `
                <div class="text-emerald-500 mb-2">> Hedef Kilitlendi: <span class="text-white">${input}</span></div>
                <div class="text-emerald-700/80 mb-1 animate-pulse">[+] Global API'ler sorgulanıyor, bekleyin...</div>
            `;
            
            try {
                // Stabilite için Kickbox Disposable API kullanıyoruz (Tarayıcıdan %100 çalışır)
                const response = await fetch(`https://open.kickbox.com/v1/disposable/${input}`);
                const data = await response.json();
                
                res.innerHTML = `<div class="text-emerald-500 mb-4">> Canlı Analiz Tamamlandı: <span class="text-white">${input}</span></div>`;
                
                const isDisposable = data.disposable ? "<span class='text-red-500 animate-pulse'>EVET (Tek Kullanımlık / Sahte)</span>" : "<span class='text-[#00ff88]'>HAYIR (Güvenilir / Kalıcı)</span>";
                
                res.innerHTML += `
                    <div class="space-y-2 border border-emerald-500/30 bg-emerald-900/10 p-4">
                        <div class="flex justify-between border-b border-emerald-500/10 pb-2">
                            <span class="text-slate-400">Geçici/Sahte Mail:</span> <span class="font-bold">${isDisposable}</span>
                        </div>
                        <div class="flex justify-between border-b border-emerald-500/10 pb-2 pt-2">
                            <span class="text-slate-400">Alan Adı (Domain):</span> <span class="font-bold text-white">${input.split('@')[1]}</span>
                        </div>
                        <div class="flex justify-between border-b border-emerald-500/10 pb-2 pt-2">
                            <span class="text-slate-400">DNS Çözümleme:</span> <span class="font-bold text-emerald-400">BAŞARILI</span>
                        </div>
                    </div>
                    <div class="text-emerald-700 mt-4 text-xs">> Gerçek zamanlı API'den veri çekildi.</div>
                `;
            } catch (error) {
                res.innerHTML = `
                    <div class="text-red-500 font-bold border border-red-500/50 p-4 bg-red-900/20">
                        [!] HATA: Sunucu yanıt vermedi veya ağ engellemesi yaşandı.
                    </div>
                `;
            }
            res.scrollTop = res.scrollHeight;
        }

        // Hem Buton Tıklaması Hem Enter Tuşu İçin Dinleyiciler
        document.getElementById('scan-btn').addEventListener('click', executeLiveScan);
        document.getElementById('osint-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { executeLiveScan(); }
        });
    </script>
</body>
</html>
