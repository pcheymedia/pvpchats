<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT & Fingerprint Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #10b981; font-family: 'Courier New', Courier, monospace; }
        .glass-panel { background: rgba(10, 15, 20, 0.85); border: 1px solid #00ff88; box-shadow: 0 0 20px rgba(0, 255, 136, 0.15); backdrop-filter: blur(10px); }
        .scan-line { width: 100%; height: 2px; background: #00ff88; opacity: 0.5; position: absolute; top: 0; left: 0; animation: scan 3s linear infinite; box-shadow: 0 0 10px #00ff88; z-index: 10; pointer-events: none; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .data-row { opacity: 0; animation: fadeIn 0.5s forwards; }
        @keyframes fadeIn { to { opacity: 1; } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #00ff88; border-radius: 3px; }
        .glitch-text { animation: glitch 2s infinite; }
        @keyframes glitch {
            0% { text-shadow: 1px 0 0 red, -1px 0 0 blue; }
            5% { text-shadow: -1px 0 0 red, 1px 0 0 blue; }
            10% { text-shadow: 0 0 0 transparent; }
            100% { text-shadow: 0 0 0 transparent; }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen relative">
    
    <header class="mb-8 border-b border-[#00ff88]/30 pb-4 flex flex-col md:flex-row justify-between items-center gap-4 relative z-10">

            <h1 class="text-3xl font-bold tracking-widest text-[#00ff88] glitch-text">
                [ V2.0_NEXUS ] OSINT_LAB

        <div class="flex items-center gap-3 border border-[#00ff88]/50 bg-[#00ff88]/10 px-4 py-2 rounded">
            <div class="w-3 h-3 bg-[#00ff88] rounded-full animate-pulse shadow-[0_0_10px_#00ff88]"></div>
            <span class="text-sm text-[#00ff88] font-bold tracking-wider">SECURE CONNECTION</span>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 relative z-10">

            </h2>

            </div>
            
            <canvas id="hidden-canvas" style="display:none;"></canvas>
        </div>

        <div class="glass-panel p-6 rounded-lg min-h-[500px] flex flex-col">

                > DEEP_OSINT_QUERY
            </h2>
            
            <div class="mb-4">
                <input type="text" id="osint-input" placeholder="> target@email.com / +905..."

            </div>
