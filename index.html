<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V365 NEXUS | ADVANCED OSINT PLATFORM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        body { background-color: #09090b; color: #e4e4e7; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(24, 24, 27, 0.65); border: 1px solid rgba(63, 63, 70, 0.5); backdrop-filter: blur(12px); border-radius: 12px; }
        .glass-header { background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(63, 63, 70, 0.5); }
        .accent-glow { box-shadow: 0 0 25px rgba(220, 38, 38, 0.15); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }

        .skeleton { background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center pb-12">

    <header class="w-full glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
            <h1 class="text-xl font-bold tracking-tight text-white">NEXUS<span class="text-red-600 font-mono text-sm ml-1">v365.1_BYPASS</span></h1>
        </div>
        <div class="flex items-center gap-2 px-3 py-1 bg-green-500/10 border border-green-500/20 rounded-full">
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
            <span class="text-xs font-mono text-green-400">GLOBAL DB ONLINE</span>
        </div>
    </header>

    <main class="w-full max-w-5xl px-4 mt-8 flex flex-col gap-6">
        
        <div class="glass-card p-2 flex items-center accent-glow focus-within:border-red-500/50 transition-colors">
            <input type="text" id="target-email" placeholder="Hedef E-Posta Adresini Girin..." 
                class="w-full bg-transparent border-none text-gray-200 p-4 focus:outline-none focus:ring-0 text-lg font-mono placeholder-zinc-600">
            <button onclick="startDeepScan()" class="bg-red-600 hover:bg-red-500 text-white font-bold py-4 px-8 rounded-lg transition-colors tracking-wide flex items-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                SCAN
            </button>
        </div>

        <div id="idle-state" class="text-center py-20 text-zinc-500">
            <svg class="w-16 h-16 mx-auto mb-4 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            <p class="font-mono text-sm tracking-widest uppercase">Waiting for Target Input</p>
        </div>

        <div id="dashboard" class="hidden flex-col gap-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass-card p-6 col-span-1 md:col-span-2 flex items-start gap-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 w-32 h-32 bg-red-600/5 rounded-full blur-3xl"></div>
                    <img id="avatar-img" src="" alt="Avatar" class="w-24 h-24 rounded-xl border border-zinc-700 bg-zinc-900 object-cover shadow-lg">
                    <div class="flex-1">
                        <div class="flex justify-between items-start">
                            <div>
                                <h2 class="text-xs text-zinc-500 font-mono uppercase mb-1">Target Identified</h2>
                                <h3 id="res-email" class="text-2xl font-bold text-white break-all">...</h3>
                            </div>
                            <span id="badge-status" class="px-3 py-1 rounded-full text-xs font-bold font-mono">...</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 mt-6">
                            <div>
                                <p class="text-xs text-zinc-500 uppercase font-mono">Domain Analysis</p>
                                <p id="res-domain" class="text-sm font-semibold text-zinc-300 mt-1">...</p>
                            </div>
                            <div>
                                <p class="text-xs text-zinc-500 uppercase font-mono">Gravatar Status</p>
                                <p id="res-gravatar" class="text-sm font-semibold text-zinc-300 mt-1">...</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-6 flex flex-col justify-center items-center relative">
                    <h3 class="text-xs text-zinc-500 font-mono uppercase mb-4 absolute top-6 left-6">Threat Score</h3>
                    <div class="relative flex justify-center items-center mt-4">
                        <svg class="w-32 h-32 transform -rotate-90">
                            <circle cx="64" cy="64" r="56" stroke="currentColor" stroke-width="8" fill="transparent" class="text-zinc-800" />
                            <circle id="score-circle" cx="64" cy="64" r="56" stroke="currentColor" stroke-width="8" fill="transparent" stroke-dasharray="351.85" stroke-dashoffset="351.85" class="text-red-500 transition-all duration-1000 ease-out" />
                        </svg>
                        <div class="absolute flex flex-col items-center">
                            <span id="score-text" class="text-3xl font-black text-white">0</span>
                            <span class="text-[10px] text-zinc-500 font-mono">/ 100</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="glass-card p-6">
                <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                        Global Data Breaches
                    </h2>
                    <span id="breach-count" class="text-xs font-mono bg-zinc-800 text-zinc-300 px-3 py-1 rounded">Scanning...</span>
                </div>
                
                <div id="breach-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                </div>
                <div id="breach-empty" class="hidden text-center py-10">
                    <p class="text-green-400 font-mono">NO BREACH RECORDS FOUND</p>
                </div>
            </div>

            <div class="glass-card p-6">
                <div class="flex justify-between items-center mb-6 border-b border-zinc-800 pb-4">
                    <h2 class="text-lg font-bold text-white flex items-center gap-2">
                        <svg class="w-5 h-5 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                        Raw Pastes & Text Leaks
                    </h2>
                    <span id="paste-count" class="text-xs font-mono bg-zinc-800 text-zinc-300 px-3 py-1 rounded">Scanning...</span>
                </div>
                
                <div id="paste-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                </div>
                 <div id="paste-empty" class="hidden text-center py-6">
                    <p class="text-zinc-500 font-mono text-sm">No raw pastes detected.</p>
                </div>
            </div>

        </div>
    </main>

    <script>
        const UI = {
            input: document.getElementById('target-email'),
            idle: document.getElementById('idle-state'),
            dash: document.getElementById('dashboard'),
            email: document.getElementById('res-email'),
            domain: document.getElementById('res-domain'),
            gravatarRes: document.getElementById('res-gravatar'),
            avatar: document.getElementById('avatar-img'),
            badge: document.getElementById('badge-status'),
            breachContainer: document.getElementById('breach-container'),
            breachCount: document.getElementById('breach-count'),
            breachEmpty: document.getElementById('breach-empty'),
            pasteContainer: document.getElementById('paste-container'),
            pasteCount: document.getElementById('paste-count'),
            pasteEmpty: document.getElementById('paste-empty'),
            scoreCircle: document.getElementById('score-circle'),
            scoreText: document.getElementById('score-text')
        };

        UI.input.addEventListener('keypress', (e) => { if(e.key === 'Enter') startDeepScan(); });

        async function startDeepScan() {
            const email = UI.input.value.trim().toLowerCase();
            if(!email || !email.includes('@')) {
                alert("Geçersiz E-Posta Formatı.");
                return;
            }

            UI.idle.classList.add('hidden');
            UI.dash.classList.remove('hidden');
            UI.breachContainer.innerHTML = '';
            UI.pasteContainer.innerHTML = '';
            UI.breachEmpty.classList.add('hidden');
            UI.pasteEmpty.classList.add('hidden');
            
            UI.email.textContent = email;
            UI.domain.textContent = email.split('@')[1];
            UI.badge.className = "px-3 py-1 rounded-full text-xs font-bold font-mono bg-zinc-800 text-zinc-400 skeleton";
            UI.badge.textContent = "ANALYZING...";
            UI.breachCount.textContent = "Querying Database...";
            UI.pasteCount.textContent = "Querying Pastes...";
            setScore(0, 'zinc');

            const emailHash = md5(email);
            UI.avatar.src = `https://www.gravatar.com/avatar/${emailHash}?d=mp&s=200`;
            checkGravatarProfile(emailHash);

            await fetchBreachData(email);
        }

        async function checkGravatarProfile(hash) {
            const img = new Image();
            img.onload = () => { UI.gravatarRes.innerHTML = `<span class="text-green-400">Custom Profile Found</span>`; };
            img.onerror = () => { UI.gravatarRes.innerHTML = `<span class="text-zinc-500">Default (No Profile)</span>`; };
            img.src = `https://www.gravatar.com/avatar/${hash}?d=404`;
        }

        async function fetchBreachData(email) {
            let breachData = [];
            let pasteData = [];
            
            try {
                // CORS Korumalı İkili İstek Sistemi (Direkt hata verirse proxy üzerinden çeker)
                let bRes;
                try {
                    bRes = await fetch(`https://api.xposedornot.com/v1/check-email/${email}`);
                } catch(e) {
                    bRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.xposedornot.com/v1/check-email/' + email)}`);
                }

                if(bRes && bRes.status === 200) {
                    const bJson = await bRes.json();
                    breachData = (bJson.breaches && bJson.breaches[0]) ? bJson.breaches[0] : [];
                }

                let pRes;
                try {
                    pRes = await fetch(`https://api.xposedornot.com/v1/paste/email/${email}`);
                } catch(e) {
                    pRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent('https://api.xposedornot.com/v1/paste/email/' + email)}`);
                }

                if(pRes && pRes.status === 200) {
                    const pJson = await pRes.json();
                    pasteData = (pJson.pastes && pJson.pastes[0]) ? pJson.pastes[0] : [];
                }

                renderResults(breachData, pasteData);

            } catch (err) {
                UI.badge.className = "px-3 py-1 rounded-full text-xs font-bold font-mono bg-red-900/50 text-red-400 border border-red-500/50";
                UI.badge.textContent = "API CONNECTION FAILED";
                UI.breachCount.textContent = "NETWORK BLOCKED";
                UI.pasteCount.textContent = "NETWORK BLOCKED";
            }
        }

        function renderResults(breaches, pastes) {
            UI.breachCount.textContent = `${breaches.length} RECORDS`;
            if(breaches.length === 0) {
                UI.breachEmpty.classList.remove('hidden');
            } else {
                breaches.forEach(b => {
                    const el = document.createElement('div');
                    el.className = "p-4 bg-zinc-900/50 border border-zinc-700/50 rounded-lg hover:border-red-500/50 transition-colors";
                    el.innerHTML = `
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-8 h-8 rounded bg-red-900/20 text-red-500 flex items-center justify-center font-bold text-xs border border-red-900/50">
                                ${b.substring(0,2).toUpperCase()}
                            </div>
                            <h4 class="font-bold text-zinc-200 capitalize truncate">${b.replace(/_/g, ' ')}</h4>
                        </div>
                        <p class="text-xs text-zinc-500 font-mono mt-3 border-t border-zinc-800 pt-2">STATUS: COMPROMISED</p>
                    `;
                    UI.breachContainer.appendChild(el);
                });
            }

            UI.pasteCount.textContent = `${pastes.length} RECORDS`;
            if(pastes.length === 0) {
                UI.pasteEmpty.classList.remove('hidden');
            } else {
                pastes.forEach(p => {
                    const el = document.createElement('div');
                    el.className = "p-3 bg-zinc-900/30 border border-purple-900/30 rounded flex justify-between items-center";
                    el.innerHTML = `
                        <span class="text-zinc-300 font-mono text-sm truncate pr-4">ID: ${p}</span>
                        <a href="https://pastebin.com/${p}" target="_blank" class="px-3 py-1 bg-purple-600/20 text-purple-400 text-xs rounded hover:bg-purple-600/40">VIEW</a>
                    `;
                    UI.pasteContainer.appendChild(el);
                });
            }

            let score = 0;
            let statusClass = "";
            let statusText = "";
            let color = "";

            if(breaches.length === 0 && pastes.length === 0) {
                score = 0;
                color = "green";
                statusText = "CLEAN";
                statusClass = "bg-green-900/30 text-green-400 border border-green-500/50";
            } else if (breaches.length > 0 && breaches.length <= 3) {
                score = 45 + (breaches.length * 5);
                color = "yellow";
                statusText = "MODERATE RISK";
                statusClass = "bg-yellow-900/30 text-yellow-400 border border-yellow-500/50 pulse-ring";
            } else {
                score = Math.min(99, 60 + (breaches.length * 3) + (pastes.length * 5));
                color = "red";
                statusText = "CRITICAL COMPROMISE";
                statusClass = "bg-red-900/30 text-red-400 border border-red-500/50 pulse-ring";
            }

            UI.badge.className = `px-3 py-1 rounded-full text-xs font-bold font-mono ${statusClass}`;
            UI.badge.textContent = statusText;
            setScore(score, color);
        }

        function setScore(score, color) {
            UI.scoreText.textContent = score;
            const circle = UI.scoreCircle;
            const circumference = 351.85;
            const offset = circumference - (score / 100) * circumference;
            circle.style.strokeDashoffset = offset;

            circle.classList.remove('text-green-500', 'text-yellow-500', 'text-red-500', 'text-zinc-500');
            if(color === 'green') circle.classList.add('text-green-500');
            else if(color === 'yellow') circle.classList.add('text-yellow-500');
            else if(color === 'red') circle.classList.add('text-red-500');
            else circle.classList.add('text-zinc-500');
        }
    </script>
</body>
</html>
